simplydone4j:
  scheduler:
    polling-interval-ms: 1000
    queue-prefix: "demo:queue"
    weights:
      high: 70
      normal: 20
      low: 10
  rate-limit:
    requests-per-minute: 100
    window-seconds: 60
  retry:
    max-attempts: 3
    initial-delay-seconds: 5
    backoff-multiplier: 2.0
  worker:
    lease-timeout-seconds: 30
    retry-promoter-interval-ms: 1000
    lease-reaper-interval-ms: 5000
  queue:
    max-depth: 10000
  executor:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    keep-alive-seconds: 60
    default-timeout-seconds: 30

spring:
  data:
    redis:
      url: redis://localhost:6379

server:
  port: 8080
