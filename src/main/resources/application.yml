spring:
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  lifecycle:
    timeout-per-shutdown-phase: 30s

simplydone4j:
  key-prefix: demo
  scheduler:
    enabled: true
  monitoring:
    enabled: true
  retry:
    max-attempts: 3
    initial-delay-seconds: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  shutdown: graceful
