spring:
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

simplydone4j:
  key-prefix: demo
  retry:
    max-attempts: 3
    initial-delay-seconds: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8080
